<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Copiloto Q&A</title>
<style>
  :root {
    --bg: #ffffff; --fg: #0f172a; --muted: #475569; --line: #e2e8f0; --surface: #f8fafc;
    --accent: #2563eb; --on-accent: #ffffff; --live: #dc2626; --ok: #16a34a;
    --space: 16px; --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0f17; --fg: #e5e9f0; --muted: #94a3b8; --line: #1f2937; --surface: #111827; --accent: #60a5fa; --on-accent: #0b0f17; --live: #f87171; --ok: #4ade80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: var(--space); display: grid; gap: var(--space); }

  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 16px; font-weight: 600; margin: 0; }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot[data-state="live"] { background: var(--live); }
  .dot[data-state="err"] { background: var(--live); outline: 2px solid var(--live); outline-offset: 2px; }

  .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding-bottom: var(--space); border-bottom: 1px solid var(--line); }
  button, .btn { min-height: 44px; padding: 0 16px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; cursor: pointer; transition: background-color .15s, border-color .15s; }
  button:hover:not(:disabled) { background: var(--surface); border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  dialog { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); padding: var(--space); width: min(480px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog form { display: grid; gap: 12px; }
  dialog label { display: grid; gap: 4px; font-size: 14px; color: var(--muted); }
  dialog h2 { margin: 0; }
  .bar select { min-height: 44px; max-width: 220px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; }
  .meter { width: 64px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
  .meter i { display: block; height: 100%; width: 0; background: var(--ok); }
  .hint { color: var(--muted); font-size: 13px; }
  label.check { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; color: var(--muted); font-size: 15px; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }

  .grid { display: grid; grid-template-columns: 3fr 2fr; gap: var(--space); }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .panel { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space); min-height: 220px; }
  #question { color: var(--muted); font-size: 14px; min-height: 21px; }
  .qrow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .scope { flex: none; font-size: 12px; font-weight: 600; padding: 1px 8px; border: 1px solid var(--muted); border-radius: 999px; color: var(--muted); }
  .scope.proyecto { border-color: var(--accent); color: var(--accent); }
  #answer { font-size: 22px; line-height: 1.45; white-space: pre-wrap; }
  #answer.empty { color: var(--muted); font-size: 16px; }
  #transcript { max-height: 340px; overflow: auto; color: var(--muted); font-size: 15px; }
  #transcript div { padding: 2px 0; }
  #transcript .interim { opacity: .55; }
  #transcript .final { cursor: pointer; border-radius: var(--radius); }
  #transcript .final:hover { background: var(--surface); }

  .ask { display: flex; gap: 8px; }
  input[type=text], input[type=password], select { flex: 1; min-width: 0; min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; }
  textarea { width: 100%; min-height: 120px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); color: var(--fg); font: inherit; font-size: 15px; resize: vertical; }

  details { border-top: 1px solid var(--line); padding-top: var(--space); }
  summary { cursor: pointer; font-weight: 600; font-size: 15px; min-height: 28px; }
  details > .body { display: grid; gap: 8px; margin-top: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--muted); font-size: 14px; }
  .note.warn { color: var(--live); }
  .doclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .doclist li { display: flex; justify-content: space-between; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 4px 4px 12px; font-size: 14px; }
  .doclist button { min-height: 36px; padding: 0 12px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Copiloto Q&amp;A</h1>
    <button id="settingsBtn" hidden aria-label="Ajustes" title="Ajustes">⚙</button>
    <div class="status" role="status" aria-live="polite"><span class="dot" id="dot" data-state="idle"></span><span id="status">Detenido</span><span class="meter" title="Nivel de entrada" aria-hidden="true"><i id="level"></i></span></div>
  </header>

  <div class="bar">
    <label class="check">Fuente de audio <select id="src" aria-label="Fuente de audio"></select></label>
    <button id="start" class="primary">Compartir pestaña y empezar</button>
    <button id="pause" disabled>Pausar</button>
    <button id="stop" disabled>Detener</button>
    <button id="float">Ventana flotante</button>
    <label class="check"><input type="checkbox" id="mic"> Incluir mi micrófono</label>
    <select id="micDev" aria-label="Micrófono"></select>
    <button id="refreshDev" hidden>Actualizar dispositivos</button>
    <span class="hint" id="micHint" hidden>usa auriculares para evitar eco</span>
  </div>

  <div class="grid">
    <section class="panel" id="answerPanel" aria-labelledby="h-answer">
      <h2 id="h-answer">Respuesta sugerida</h2>
      <div class="qrow"><span id="scope" class="scope" hidden></span><div id="question"></div></div>
      <div id="answer" class="empty" aria-live="polite">Esperando una pregunta.</div>
    </section>
    <section class="panel" aria-labelledby="h-tr">
      <h2 id="h-tr">Transcripción en vivo</h2>
      <div id="transcript"></div>
    </section>
  </div>

  <div class="ask">
    <input type="text" id="manual" placeholder="Pregunta manual o ensayo (Enter)" aria-label="Pregunta manual">
    <button id="ask">Preguntar</button>
  </div>

  <details id="ctxBox" open>
    <summary>Contexto del proyecto</summary>
    <div class="body">
      <textarea id="ctx" aria-label="Contexto del proyecto" placeholder="Qué es el proyecto, arquitectura, decisiones, limitaciones, resultados, preguntas difíciles..."></textarea>
      <div class="row">
        <input type="file" id="docs" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple aria-label="Añadir archivos de contexto">
      </div>
      <ul id="docList" class="doclist"></ul>
      <span id="ctxInfo" class="note" role="status" aria-live="polite"></span>
    </div>
  </details>

  <details>
    <summary>Transcribir archivo de audio</summary>
    <div class="body">
      <div class="row">
        <input type="file" id="file" accept="audio/*,.m4a,.mp3,.wav,.mp4,.ogg,.flac" aria-label="Archivo de audio">
        <label class="check"><input type="checkbox" id="diarize"> Separar hablantes</label>
        <button id="transcribe" class="primary" disabled>Transcribir</button>
        <span id="fstatus" class="note" role="status" aria-live="polite"></span>
        <button id="openDir" hidden>Abrir carpeta</button>
      </div>
      <textarea id="fileText" style="min-height:160px" placeholder="La transcripción aparecerá aquí" aria-label="Transcripción del archivo" readonly></textarea>
      <div class="row">
        <button id="copyText" disabled>Copiar</button>
        <button id="dlText" disabled>Descargar .txt</button>
        <button id="toCtx" disabled>Añadir al contexto</button>
      </div>
    </div>
  </details>
</div>
<dialog id="settings" aria-labelledby="h-settings">
  <form method="dialog" id="settingsForm">
    <h2 id="h-settings">Ajustes</h2>
    <label>Clave de Deepgram <input type="password" id="sDg" autocomplete="off"></label>
    <label>Clave de Anthropic <input type="password" id="sAn" autocomplete="off"></label>
    <label>Idioma
      <select id="sLang"><option value="es">Español</option><option value="en">English</option><option value="multi">Multilingüe</option></select>
    </label>
    <label>Modelo <input type="text" id="sModel" autocomplete="off"></label>
    <label>Términos clave (nombres del proyecto, siglas…) <input type="text" id="sKeyterms" autocomplete="off" placeholder="separados por comas"></label>
    <label>Carpeta de transcripciones
      <div class="row"><input type="text" id="sDir" readonly><button type="button" id="sPick">Cambiar…</button></div>
    </label>
    <div class="note warn" id="sErr" role="alert" hidden></div>
    <div class="row">
      <button type="submit" class="primary" id="sSave">Guardar</button>
      <button type="button" id="sCancel">Cancelar</button>
    </div>
  </form>
</dialog>
<script>
// Se guardan los nodos al cargar: al mover el panel a la ventana flotante, getElementById deja de encontrarlos.
const nodes = {};
document.querySelectorAll('[id]').forEach((el) => (nodes[el.id] = el));
const $ = (id) => nodes[id];
const ctx = $('ctx');

// Ventana flotante siempre encima (Document Picture-in-Picture: Chrome/Edge 116+).
const floatBtn = $('float');
// En escritorio la flotante es una ventana propia (ver electron/main.js); en web sigue el Document PiP.
if (!window.desktop?.float && !('documentPictureInPicture' in window)) floatBtn.hidden = true;
floatBtn.onclick = async () => {
  if (window.desktop?.float) return window.desktop.float.toggle();
  if (documentPictureInPicture.window) return documentPictureInPicture.window.close();
  const pip = await documentPictureInPicture.requestWindow({ width: 460, height: 320 });
  document.querySelectorAll('style').forEach((s) => pip.document.head.appendChild(s.cloneNode(true)));
  pip.document.body.style.cssText = 'margin:0;padding:12px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif';
  const panel = $('answerPanel'), home = panel.parentNode, next = panel.nextSibling;
  panel.style.cssText = 'border:0;padding:0;min-height:0';
  pip.document.body.append(panel);
  floatBtn.textContent = 'Cerrar ventana flotante';
  pip.addEventListener('pagehide', () => {
    panel.removeAttribute('style');
    home.insertBefore(panel, next);
    floatBtn.textContent = 'Ventana flotante';
  });
};
let docs = [];
try {
  ctx.value = localStorage.getItem('ctx') ?? '';
  docs = JSON.parse(localStorage.getItem('docs') ?? '[]');
} catch {}
if (ctx.value || docs.length) $('ctxBox').open = false;

const MAX_DOC_CHARS = 400000; // ~100k tokens: tope duro para no desbordar el modelo
const WARN_TOKENS = 25000;    // a partir de aquí la primera palabra tarda más

function buildContext() {
  return [ctx.value, ...docs.map((d) => `=== ARCHIVO: ${d.name} ===\n${d.text}`)].filter(Boolean).join('\n\n');
}

function renderDocs() {
  const list = $('docList');
  list.replaceChildren(...docs.map((d, i) => {
    const li = document.createElement('li');
    const label = document.createElement('span');
    label.textContent = `${d.name} · ${Math.round(d.text.length / 4).toLocaleString('es')} tokens`;
    const btn = document.createElement('button');
    btn.textContent = 'Quitar';
    btn.onclick = () => { docs.splice(i, 1); saveDocs(); };
    li.append(label, btn);
    return li;
  }));
  const tokens = Math.round(buildContext().length / 4);
  const info = $('ctxInfo');
  info.textContent = `Contexto total: ~${tokens.toLocaleString('es')} tokens` +
    (tokens > WARN_TOKENS ? ' · grande: las respuestas empezarán más lento' : '');
  info.className = 'note' + (tokens > WARN_TOKENS ? ' warn' : '');
}

function pushContext() {
  if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'context', text: buildContext() }));
}

function saveDocs() {
  try { localStorage.setItem('docs', JSON.stringify(docs)); } catch { setStatus('Error: los documentos no caben en el almacenamiento del navegador'); }
  renderDocs();
  pushContext();
}

$('docs').onchange = async (e) => {
  for (const f of e.target.files) {
    if (f.size > MAX_DOC_CHARS) { $('ctxInfo').textContent = `${f.name} supera 400 KB y se omitió`; continue; }
    const text = await f.text();
    const i = docs.findIndex((d) => d.name === f.name);
    if (i >= 0) docs[i] = { name: f.name, text }; else docs.push({ name: f.name, text });
  }
  e.target.value = '';
  saveDocs();
};
renderDocs();

const isDesktop = !!window.desktop?.isDesktop;
const authToken = new URLSearchParams(location.search).get('t');
if (isDesktop) {
  $('micHint').hidden = false;
  $('settingsBtn').hidden = false;
  initSettings();
}

async function initSettings() {
  const dlg = $('settings');
  const showErr = (t) => { $('sErr').textContent = t || ''; $('sErr').hidden = !t; };
  async function openSettings() {
    const c = await window.desktop.getConfig();
    $('sDg').value = $('sAn').value = '';
    $('sDg').placeholder = c.hasDeepgramKey ? 'Guardada: dejar vacío para no cambiar' : 'Pega tu clave';
    $('sAn').placeholder = c.hasAnthropicKey ? 'Guardada: dejar vacío para no cambiar' : 'Pega tu clave';
    $('sLang').value = c.language;
    $('sModel').value = c.model;
    $('sKeyterms').value = c.keyterms ?? '';
    $('sDir').value = c.transcriptsDir;
    showErr('');
    if (!dlg.open) dlg.showModal();
    return c;
  }
  $('settingsBtn').onclick = () => openSettings().catch((e) => setStatus('Error: ' + e.message));
  $('sCancel').onclick = () => dlg.close();
  $('sPick').onclick = async () => {
    try { const d = await window.desktop.pickTranscriptsDir(); if (d) $('sDir').value = d; } catch (e) { showErr(e.message); }
  };
  $('settingsForm').onsubmit = async (e) => {
    e.preventDefault();
    $('sSave').disabled = true;
    showErr('');
    try {
      // Al guardar se reinicia el servidor y la ventana se recarga con el token nuevo.
      await window.desktop.saveConfig({
        deepgramKey: $('sDg').value, anthropicKey: $('sAn').value,
        language: $('sLang').value, model: $('sModel').value, keyterms: $('sKeyterms').value, transcriptsDir: $('sDir').value,
      });
    } catch (err) {
      showErr(err.message.replace(/^Error invoking remote method '[^']+': (Error: )?/, ''));
      $('sSave').disabled = false;
    }
  };
  $('openDir').onclick = () => window.desktop.openTranscripts().catch((e) => fstatus('Error: ' + e.message));
  try {
    const c = await window.desktop.getConfig();
    if (!c.hasDeepgramKey || !c.hasAnthropicKey) await openSettings();
  } catch {}
}
let ws, audioCtx, streams = [], paused = false, interimEl = null;

function setStatus(t, state) {
  $('status').textContent = t;
  $('dot').dataset.state = state ?? (t.startsWith('Error') ? 'err' : t.startsWith('Escuchando') ? 'live' : 'idle');
}

function connect() {
  return new Promise((resolve, reject) => {
    ws = new WebSocket(`ws://${location.host}/ws${authToken ? `?t=${encodeURIComponent(authToken)}` : ''}`);
    ws.binaryType = 'arraybuffer';
    ws.onopen = () => { pushContext(); resolve(); };
    ws.onerror = reject;
    ws.onclose = () => { if (!$('status').textContent.startsWith('Error')) setStatus('Desconectado'); };
    ws.onmessage = (e) => handle(JSON.parse(e.data));
  });
}

function handle(m) {
  if (m.type === 'transcript') {
    const box = $('transcript');
    if (!interimEl) {
      interimEl = document.createElement('div');
      box.appendChild(interimEl);
    }
    interimEl.textContent = m.text;
    interimEl.className = m.final ? 'final' : 'interim';
    if (m.final) {
      // Plan B cuando la detección falla: clic o Enter en una frase final la envía como pregunta.
      interimEl.tabIndex = 0;
      interimEl.title = 'Responder a esta frase';
      interimEl = null;
    }
    box.scrollTop = box.scrollHeight;
  } else if (m.type === 'answer_start') {
    $('question').textContent = m.question;
    $('scope').hidden = true;
    $('answer').textContent = '';
    $('answer').classList.remove('empty');
  } else if (m.type === 'answer_delta') {
    $('answer').textContent += m.text;
  } else if (m.type === 'answer_scope') {
    const sc = $('scope');
    sc.textContent = m.scope === 'proyecto' ? 'Sobre tu proyecto' : 'General';
    sc.className = 'scope ' + m.scope;
    sc.hidden = false;
  } else if (m.type === 'answer_truncated') {
    $('answer').textContent += ' …';
  } else if (m.type === 'status') {
    setStatus(m.text, $('dot').dataset.state);
  } else if (m.type === 'error') {
    setStatus('Error: ' + m.text);
  }
}

// --- Dispositivos de entrada. 'display' = flujo por defecto (audio del sistema / pestaña compartida).
const DEFAULT_SRC = isDesktop ? 'Audio del sistema' : 'Pestaña compartida';
const store = {
  get: (k) => { try { return localStorage.getItem(k) ?? ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};

function updateStartLabel() {
  $('start').textContent = $('src').value !== 'display' ? 'Empezar a escuchar' : isDesktop ? 'Escuchar audio del sistema' : 'Compartir pestaña y empezar';
}

async function refreshDevices() {
  let inputs = [];
  try { inputs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput'); } catch {}
  // Sin permiso previo los dispositivos llegan sin id ni label: no se pueden elegir hasta pedir permiso.
  const needsPermission = inputs.some((d) => !d.label || !d.deviceId);
  inputs = inputs.filter((d) => d.deviceId);
  const fill = (sel, first, saved) => {
    sel.replaceChildren(new Option(first[1], first[0]));
    inputs.forEach((d, i) => sel.add(new Option(d.label || `Dispositivo ${i + 1}`, d.deviceId)));
    const want = [...sel.options].some((o) => o.value === sel.dataset.cur) ? sel.dataset.cur : saved;
    // Si el dispositivo guardado ya no existe, vuelve a la opción por defecto.
    sel.value = [...sel.options].some((o) => o.value === want) ? want : first[0];
    sel.dataset.cur = sel.value;
  };
  fill($('src'), ['display', DEFAULT_SRC], store.get('src'));
  fill($('micDev'), ['', 'Predeterminado'], store.get('micDev'));
  $('refreshDev').hidden = !needsPermission;
  updateStartLabel();
}

$('src').onchange = () => { $('src').dataset.cur = $('src').value; store.set('src', $('src').value); updateStartLabel(); };
$('micDev').onchange = () => { $('micDev').dataset.cur = $('micDev').value; store.set('micDev', $('micDev').value); };
// Sin permiso previo los labels vienen vacíos: se pide el micrófono una vez, se libera y se vuelve a listar.
$('refreshDev').onclick = async () => {
  try { (await navigator.mediaDevices.getUserMedia({ audio: true })).getTracks().forEach((t) => t.stop()); } catch {}
  refreshDevices();
};
navigator.mediaDevices.ondevicechange = refreshDevices;
refreshDevices();

// Indicador de nivel: AnalyserNode sobre las mismas fuentes que van al worklet.
let meterRaf = 0;
function startMeter(analyser) {
  const buf = new Float32Array(analyser.fftSize);
  const tick = () => {
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (const v of buf) sum += v * v;
    const rms = Math.sqrt(sum / buf.length);
    $('level').style.width = `${Math.min(100, Math.sqrt(rms) * 140)}%`;
    $('level').dataset.rms = rms.toFixed(5);
    meterRaf = requestAnimationFrame(tick);
  };
  tick();
}

$('start').onclick = async () => {
  try {
    try { localStorage.setItem('ctx', ctx.value); } catch {}
    const src = $('src').value;
    let main;
    if (src === 'display') {
      main = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
      streams = [main];
      main.getVideoTracks().forEach((t) => t.stop());
      if (!main.getAudioTracks().length) {
        stop();
        setStatus(isDesktop ? 'Error: no se pudo capturar el audio del sistema.' : 'Error: no se capturó audio. Marca "Compartir audio de la pestaña".');
        return;
      }
    } else {
      // Mezcla de línea (p. ej. VoiceMeeter): sin procesado de voz.
      main = await navigator.mediaDevices.getUserMedia({
        audio: { deviceId: { exact: src }, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      });
      streams = [main];
    }
    let note = '';
    if ($('mic').checked) {
      const micId = $('micDev').value;
      if (src !== 'display' && (micId || 'default') === src) {
        note = 'Micrófono omitido: es el mismo dispositivo que la fuente';
      } else {
        streams.push(await navigator.mediaDevices.getUserMedia({
          audio: { ...(micId && { deviceId: { exact: micId } }), echoCancellation: true, noiseSuppression: false, autoGainControl: false, latency: 0 },
        }));
      }
    }

    await connect();
    audioCtx = new AudioContext({ sampleRate: 16000, latencyHint: 'interactive' });
    await audioCtx.audioWorklet.addModule('worklet.js');
    // Entrada mono explícita: el navegador mezcla L+R. Sin esto el worklet solo leía el canal izquierdo.
    const node = new AudioWorkletNode(audioCtx, 'pcm-sender', { numberOfOutputs: 0, channelCount: 1, channelCountMode: 'explicit' });
    node.port.onmessage = (e) => {
      if (!paused && ws?.readyState === WebSocket.OPEN) ws.send(e.data);
    };
    const analyser = audioCtx.createAnalyser();
    for (const s of streams) {
      const source = audioCtx.createMediaStreamSource(new MediaStream(s.getAudioTracks()));
      source.connect(node);
      source.connect(analyser);
    }
    startMeter(analyser);
    main.getAudioTracks()[0].onended = stop;

    $('start').disabled = true;
    $('pause').disabled = false;
    $('stop').disabled = false;
    setStatus(note ? `Escuchando · ${note}` : 'Escuchando', 'live');
  } catch (err) {
    stop();
    setStatus('Error: ' + err.message);
  }
};

function stop() {
  streams.forEach((s) => s.getTracks().forEach((t) => t.stop()));
  streams = [];
  cancelAnimationFrame(meterRaf);
  $('level').style.width = '0';
  $('level').dataset.rms = '0';
  audioCtx?.close();
  audioCtx = null;
  if (ws) ws.onclose = null; // que el cierre manual no pise el estado "Detenido"
  ws?.close();
  ws = null;
  paused = false;
  $('pause').textContent = 'Pausar';
  $('start').disabled = false;
  $('pause').disabled = true;
  $('stop').disabled = true;
  setStatus('Detenido', 'idle');
}

$('stop').onclick = stop;

$('pause').onclick = () => {
  paused = !paused;
  $('pause').textContent = paused ? 'Reanudar' : 'Pausar';
  setStatus(paused ? 'En pausa (sin enviar audio)' : 'Escuchando', paused ? 'idle' : 'live');
};

async function sendAsk(text) {
  if (!ws || ws.readyState !== WebSocket.OPEN) await connect();
  pushContext();
  ws.send(JSON.stringify({ type: 'ask', text }));
}

async function ask() {
  const text = $('manual').value.trim();
  if (!text) return;
  await sendAsk(text);
  $('manual').value = '';
}

const answerFromLine = (e) => {
  const line = e.target.closest?.('#transcript .final');
  if (line) sendAsk(line.textContent.trim()).catch((err) => setStatus('Error: ' + err.message));
};
$('transcript').onclick = answerFromLine;
$('transcript').onkeydown = (e) => e.key === 'Enter' && answerFromLine(e);

// --- Transcripción de archivos ---
const fileInput = $('file'), fileText = $('fileText');
const fstatus = (t) => ($('fstatus').textContent = t);
fileInput.onchange = () => ($('transcribe').disabled = !fileInput.files.length);

$('transcribe').onclick = () => {
  const f = fileInput.files[0];
  if (!f) return;
  $('transcribe').disabled = true;
  fileText.value = '';
  ['copyText', 'dlText', 'toCtx'].forEach((id) => ($(id).disabled = true));
  fstatus('Subiendo 0%');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `/transcribe?diarize=${$('diarize').checked ? 1 : 0}&name=${encodeURIComponent(f.name)}${authToken ? `&t=${encodeURIComponent(authToken)}` : ''}`);
  xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
  xhr.upload.onprogress = (e) => e.lengthComputable && fstatus(`Subiendo ${Math.round((e.loaded / e.total) * 100)}%`);
  xhr.upload.onload = () => fstatus('Transcribiendo en Deepgram...');
  xhr.onload = () => {
    $('transcribe').disabled = false;
    let r = {};
    try { r = JSON.parse(xhr.responseText); } catch {}
    if (xhr.status !== 200) return fstatus('Error: ' + (r.error || xhr.status));
    fileText.value = r.text || '(sin texto detectado)';
    $('openDir').hidden = !(isDesktop && r.saved);
    fstatus((r.duration ? `Listo (${Math.round(r.duration / 60)} min de audio)` : 'Listo') + (r.saved ? ` · guardado en transcripciones/${r.saved}` : ''));
    ['copyText', 'dlText', 'toCtx'].forEach((id) => ($(id).disabled = !r.text));
  };
  xhr.onerror = () => { $('transcribe').disabled = false; fstatus('Error de red'); };
  xhr.send(f);
};
$('copyText').onclick = () => navigator.clipboard.writeText(fileText.value);
$('dlText').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([fileText.value], { type: 'text/plain' }));
  a.download = (fileInput.files[0]?.name.replace(/\.[^.]+$/, '') || 'transcripcion') + '.txt';
  a.click();
};
$('toCtx').onclick = () => {
  ctx.value += (ctx.value ? '\n\n' : '') + 'TRANSCRIPCIÓN DE REFERENCIA:\n' + fileText.value;
  ctx.onchange();
  fstatus('Añadido al contexto');
};

$('ask').onclick = ask;
$('manual').onkeydown = (e) => e.key === 'Enter' && ask();
ctx.onchange = () => {
  try { localStorage.setItem('ctx', ctx.value); } catch {}
  renderDocs();
  pushContext();
};
</script>
</body>
</html>
